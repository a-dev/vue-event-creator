name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  ci:
    name: Ordinary CI gate
    uses: ./.github/workflows/ci.yml

  cross-browser:
    name: Cross-browser E2E gate
    uses: ./.github/workflows/scheduled-e2e.yml

  publish:
    name: Publish to npm
    needs: [ci, cross-browser]
    runs-on: ubuntu-latest
    # The npm trusted publisher is bound to this environment name, so a release
    # also requires whatever reviewers/branch rules that environment enforces.
    environment: npm-publish
    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      # Trusted publishing needs npm 11.5.1 or newer, which the npm bundled
      # with Node 24 already satisfies. Do not `npm install -g npm@latest`
      # here: that put the release gate on a different npm than every CI job,
      # so a breaking npm change surfaced only at publish time. Assert the
      # floor instead and fail loudly if a runner image ever regresses.
      - name: Verify npm supports trusted publishing
        run: |
          required=11.5.1
          actual="$(npm -v)"
          if [ "$(printf '%s\n%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $actual is older than $required, required for trusted publishing." >&2
            exit 1
          fi
          echo "npm $actual satisfies >=$required."
      # No NPM_TOKEN: npm exchanges the job's OIDC identity for short-lived
      # credentials, and provenance is attached automatically.
      #
      # `npm stage publish`, not `npm publish`: OIDC proves which workflow is
      # publishing, never that a maintainer intended this release. Staging
      # defers proof-of-presence, so the package keeps its "require 2FA"
      # setting and a maintainer approves the staged version before it goes
      # public. Publishing directly would need "Allow npm publish" on the npm
      # trusted publisher, which this package deliberately leaves off.
      #
      # `prepublishOnly` runs `release:check` (format, types, lint, unit and
      # browser tests, build, package checks, E2E) for staged publishes too, so
      # publication cannot skip the gate even when invoked manually.
      - name: Stage publish
        run: npm stage publish --access public
      - name: Explain the pending approval
        run: |
          echo "::notice::Version staged, not yet public. Approve it with" \
               "\`npm stage list vue-event-creator\` then" \
               "\`npm stage approve <stage-id>\` (2FA required), or from the" \
               "package page on npmjs.com."
      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

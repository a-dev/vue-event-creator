name: Scheduled cross-browser E2E

on:
  schedule:
    # 04:00 UTC daily, off the pull-request critical path.
    - cron: '0 4 * * *'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: scheduled-e2e-${{ github.ref }}
  cancel-in-progress: false

env:
  TZ: UTC

jobs:
  cross-browser:
    name: E2E on ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install ${{ matrix.browser }} for Playwright
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: End-to-end tests
        env:
          E2E_ALL_BROWSERS: '1'
        run: >-
          bunx playwright test
          --project demo-${{ matrix.browser }}
          --project packed-${{ matrix.browser }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report
            test-results
          retention-days: 7

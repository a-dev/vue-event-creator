name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TZ: UTC

jobs:
  static:
    name: Format, types, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Type-check
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Unit tests
        run: bun run test:unit

  browser:
    name: Browser tests
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: Browser tests
        run: bun run test:browser

  package:
    name: Build and package gates
    needs: static
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build library
        run: bun run build
      - name: Lint published package
        run: bun run package:lint
      - name: Check published types
        run: bun run package:types
      - name: Pack dry run
        run: bun run package:dry-run
      - name: Build packed ESM consumer
        run: bun run package:consumer

  e2e:
    name: Playwright end-to-end (Chromium)
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.12.0'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium
      - name: End-to-end tests
        run: bun run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-chromium
          path: |
            playwright-report
            test-results
          retention-days: 7

name: CI

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22.12
        uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
      - name: Use Bun 1.4.1
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install and test
        run: |
          bun install --frozen-lockfile
          bun run test --ci
